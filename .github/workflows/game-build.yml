name: game build
# Builds the server release from `ref`: the Java exporters on the Mac mini's runner, then a server folder
# (horizon-engine, horizon-prepare, horizon-server) for Linux and Windows on GitHub and macOS on the Mac mini. Called by release.yml, always from main's copy of this
# file: the caller's commit, never the one being built. It holds no secrets: signing the checksums is the caller's
# own job, which never runs what this one built. See docs/release-flow.md.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (HORIZON_VERSION), e.g. 0.2.81
        type: string
        required: true
permissions:
  contents: read
jobs:
  exporters:
    # This runner holds the maintainer's own pinned Minecraft jars. Only our classes leave it.
    runs-on: ${{ vars.MAC_RUNNER }}
    # Three full preparations (two isolated, one batched) besides the compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tools/ci/runner-env.sh
        env:
          HORIZON_NO_SCCACHE: '1'
      - run: bash tools/ci/vanilla-data.sh
      - name: Compile and validate original exporters against the pinned jars
        shell: bash
        run: |
          set -euo pipefail
          # target/ is gone after the clean checkout, and vanilla-data.sh builds the preparer only when it
          # prepares afresh.
          cargo build --release --locked -p horizon-prepare
          # Compiled here, never taken from the runner's shared preparations: pull requests' parity jobs
          # write those (vanilla-data.sh links .local/exporters to them).
          rm -rf .local/exporters
          bundle=$(target/release/horizon-prepare compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          # Only our classes and their manifest leave this runner.
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary target/release/horizon-prepare
      - uses: actions/upload-artifact@v4
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  server:
    needs: exporters
    name: server ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the binaries run on any recent distribution (packaging/server/install.sh).
          - name: linux
            os: ubuntu-22.04
            dir: horizon-server-linux-x86_64
            asset: horizon-server-linux-x86_64.tar.gz
          # Windows and macOS keep the asset names `horizon-server update` and the installers look for
          # (crates/horizon-server/src/update.rs, packaging/server/install.ps1 and install.sh).
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            # The C runtime linked in, so the programs run without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: macos
            mac: true
            dir: horizon-macos-arm64
            asset: horizon-macos-arm64.zip
    runs-on: ${{ matrix.mac && vars.MAC_RUNNER || matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The release's version, built in (horizon_core::release): --version, user agents and crash reports say it.
      # No version-bump commits.
      HORIZON_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Always from a clean checkout, the Mac mini's runner too: its work folder is shared with pull requests'
          # parity jobs, and nothing they leave may end up in a release.
          clean: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: release-server-${{ matrix.name }}
      - name: Build the engine, horizon-prepare and horizon-server
        # The engine with code mods.
        run: |
          cargo build --release --locked -p horizon-client --features mods --bin horizon-client \
            -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - uses: actions/download-artifact@v4
        with:
          name: original-exporters
          path: exporters
      - name: Package and check the server folder
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package-server "target/release/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          folder="dist/${{ matrix.dir }}"
          for binary in horizon-engine horizon-prepare horizon-server; do
            file="$folder/$binary${{ matrix.exe }}"
            if [[ "$RUNNER_OS" == macOS ]]; then
              others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
              [[ -z "$others" ]] || { echo "::error::$binary links $others"; exit 1; }
            else
              ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py --server "$file"
            fi
          done
          "$folder/horizon-engine${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$folder/horizon-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in horizon-prepare horizon-server; do
            out=$("$folder/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $HORIZON_VERSION" ]] || { echo "::error::expected $binary $HORIZON_VERSION"; exit 1; }
          done
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
               else
                 # Without resource forks and extended attributes: plain ditto adds an
                 # AppleDouble `._` file beside every file that has any.
                 ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
                 if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
                   echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
                 fi
               fi ;;
          esac
          ls -l "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
