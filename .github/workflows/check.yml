name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - name: Verify official build input
        run: python3 tools/oracle.py fetch
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/pumpkin/Cargo.toml --all -- --check
      - run: cargo test --locked
        env:
          PUMPKIN_MINECRAFT_SERVER_JAR: ${{ github.workspace }}/.cache/vanilla/26.3/server.jar
      - run: cargo test --locked -p pumpkin-command --lib argument_types::block
      - run: cargo test --manifest-path vendor/pumpkin/Cargo.toml --locked -p pumpkin-world --lib --target-dir target
        env:
          PUMPKIN_MINECRAFT_SERVER_JAR: ${{ github.workspace }}/.cache/vanilla/26.3/server.jar
      - run: cargo test --manifest-path vendor/pumpkin/Cargo.toml --locked -p pumpkin-core --lib stores_redirect_to_execute_then_the_nested_command --target-dir target
        env:
          PUMPKIN_MINECRAFT_SERVER_JAR: ${{ github.workspace }}/.cache/vanilla/26.3/server.jar
      - run: cargo test --manifest-path vendor/pumpkin/Cargo.toml --locked -p pumpkin-core --lib world_save_ --target-dir target
        env:
          PUMPKIN_MINECRAFT_SERVER_JAR: ${{ github.workspace }}/.cache/vanilla/26.3/server.jar
      - run: cargo clippy --locked --all-targets -- -D warnings
        env:
          PUMPKIN_MINECRAFT_SERVER_JAR: ${{ github.workspace }}/.cache/vanilla/26.3/server.jar
      - run: npm ci
      - run: npm run test:protocol
      - run: npm run check:protocol
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/validate_features.py --check-artifacts
