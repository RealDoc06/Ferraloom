name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  VANILLA_SHA1: 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # Tests read the official 26.3 server jar; it is never committed.
      - name: Cache vanilla server jar
        uses: actions/cache@v4
        with:
          path: .cache/vanilla/server.jar
          key: vanilla-${{ env.VANILLA_SHA1 }}
      - name: Fetch vanilla server jar
        run: |
          mkdir -p .cache/vanilla
          jar=.cache/vanilla/server.jar
          if [ ! -f "$jar" ]; then
            curl -fsSL -o "$jar" "https://piston-data.mojang.com/v1/objects/$VANILLA_SHA1/server.jar"
          fi
          echo "$VANILLA_SHA1  $jar" | sha1sum -c -
          echo "FERRALOOM_VANILLA_JAR=$PWD/$jar" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
