name: Vanilla compatibility
on:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: 'I accept https://aka.ms/MinecraftEULA for local reference tests'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  parity:
    if: ${{ inputs.accept_eula }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/oracle.py fetch
      - run: cargo build --locked
        env:
          PUMPKIN_MINECRAFT_SERVER_JAR: ${{ github.workspace }}/.cache/vanilla/26.3/server.jar
      - name: Compare the same scenarios on both implementations
        run: python3 tools/parity/suite.py --accept-eula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-evidence
          include-hidden-files: true
          path: |
            compatibility/results/latest.json
            .cache/runs/**/console.log
