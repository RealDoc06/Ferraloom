[package]
name = "ferraloom-storage"
description = "Anvil worlds, player data and data fixing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferraloom-util.workspace = true
ferraloom-nbt.workspace = true
ferraloom-data.workspace = true
ferraloom-chunk.workspace = true

log = "0.4.29"
flate2 = "1.1.9"
lz4_flex = { version = "0.11.6", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash32"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
time = { version = "0.3.47", features = ["formatting", "local-offset"] }

[lints]
workspace = true
