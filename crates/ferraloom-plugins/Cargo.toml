[package]
name = "ferraloom-plugins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bukkit/Spigot plugins in Ferraloom: an in-process JVM loaded only when plugins/ holds a jar (docs/ferraloom/plugins.md)"

[dependencies]
# Without the `invocation` feature: libjvm is found and loaded at run time (src/jvm.rs), never linked.
jni = { version = "0.21.1", default-features = false }
libloading = "0.8.9"
serde_json = "1.0.151"

[dev-dependencies]
horizon-protocol = { path = "../horizon-protocol" }
horizon-world = { path = "../horizon-world" }

[lints]
workspace = true
