[package]
name = "ferraloom-data"
description = "Vanilla registries and data generated from the 26.3 server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferraloom-util.workspace = true
ferraloom-nbt.workspace = true
serde_json = { version = "1", features = ["arbitrary_precision", "unbounded_depth"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
serde_json = "1"
