[package]
name = "ferraloom-game"
description = "The vanilla simulation: levels, blocks, entities, items, commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
elsa = "1.11.2"
ferraloom-util.workspace = true
ferraloom-nbt.workspace = true
ferraloom-data.workspace = true
ferraloom-chunk.workspace = true
ferraloom-light.workspace = true
ferraloom-worldgen.workspace = true
ferraloom-storage.workspace = true
ferraloom-brigadier.workspace = true
ferraloom-protocol.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }

jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
flate2 = "1.1.10"


[features]
test-fixtures = []

[lints]
workspace = true
