[package]
name = "ferraloom-server"
description = "Ferraloom dedicated server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferraloom"
path = "src/main.rs"

[dependencies]
ferraloom-util.workspace = true
ferraloom-nbt.workspace = true
ferraloom-data.workspace = true
ferraloom-protocol.workspace = true
ferraloom-worldgen.workspace = true
ferraloom-storage.workspace = true
ferraloom-brigadier.workspace = true
ferraloom-game.workspace = true
ferraloom-chunk.workspace = true
ferraloom-light.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
rand = "0.8"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
base64 = "0.22"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"

[lints]
workspace = true
