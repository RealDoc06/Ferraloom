[package]
name = "ferraloom-parity"
description = "Runs identical scenarios against vanilla and Ferraloom and compares them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferraloom-util.workspace = true
ferraloom-nbt.workspace = true
ferraloom-data.workspace = true
ferraloom-protocol.workspace = true

ferraloom-storage.workspace = true
ferraloom-server = { path = "../ferraloom-server" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }

[lints]
workspace = true
