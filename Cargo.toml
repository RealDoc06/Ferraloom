[package]
name = "ferraloom"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.98"
description = "An independently implemented Minecraft Java server in Rust"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
md-5 = "0.10"
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.release]
debug = 0
lto = "thin"
