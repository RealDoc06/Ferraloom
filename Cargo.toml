[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/RealDoc06/Ferraloom"

[workspace.dependencies]
ferraloom-util = { path = "crates/ferraloom-util" }
ferraloom-nbt = { path = "crates/ferraloom-nbt" }
ferraloom-data = { path = "crates/ferraloom-data" }
ferraloom-chunk = { path = "crates/ferraloom-chunk" }
ferraloom-protocol = { path = "crates/ferraloom-protocol" }
ferraloom-worldgen = { path = "crates/ferraloom-worldgen" }
ferraloom-storage = { path = "crates/ferraloom-storage" }
ferraloom-brigadier = { path = "crates/ferraloom-brigadier" }
ferraloom-game = { path = "crates/ferraloom-game" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
